[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-bench"
version = "0.1.0"
description = "Benchmark open source de parsers de NF-e/NFC-e/CT-e brasileiros"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
# parsers de terceiros — instale conforme for adicionando adapters
parsers = [
  # "pynfe",
  # "nfelib",
]

[tool.setuptools.packages.find]
include = ["nfe_bench*"]
