name: benchmark

on:
  push:
    paths:
      - "nfe_bench/**"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/benchmark.yml"
  schedule:
    - cron: "0 12 * * 1"   # toda segunda-feira, 12h UTC (9h BRT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala o projeto
        run: pip install -e .

      - name: Roda o benchmark
        run: python -m nfe_bench.runner

      - name: Gera o relatório
        run: python scripts/generate_report.py

      - name: Envia resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/

      - name: Commita os resultados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "chore: atualiza resultados do benchmark [skip ci]"
          git push
