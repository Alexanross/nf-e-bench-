<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nfe-bench · Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --green: #3fb950; --yellow: #d29922; --red: #f85149; --accent: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text);
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif; padding: 32px 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 28px; font-size: .95rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
           gap: 14px; margin-bottom: 28px; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 10px; padding: 18px; }
  .card .label { color: var(--muted); font-size: .78rem; text-transform: uppercase;
                 letter-spacing: .5px; margin-bottom: 6px; }
  .card .value { font-size: 1.7rem; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
          margin-bottom: 28px; }
  th, td { padding: 12px 16px; text-align: left; font-size: .92rem; }
  th { background: #1c2128; color: var(--muted); font-size: .78rem;
       text-transform: uppercase; letter-spacing: .5px; }
  tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .bar-wrap { background: #21262d; border-radius: 6px; height: 8px; width: 140px; }
  .bar { height: 8px; border-radius: 6px; background: var(--green); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px;
           font-size: .78rem; font-weight: 600; }
  .badge.ok { background: rgba(63,185,80,.15); color: var(--green); }
  .badge.err { background: rgba(248,81,73,.15); color: var(--red); }
  details { background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; font-size: .95rem; }
  .detail-line { color: var(--muted); font-size: .86rem; padding: 6px 0 0 16px; }
  .warn { color: var(--yellow); }
  .footer { color: var(--muted); font-size: .82rem; margin-top: 24px; text-align: center; }
  .live { color: var(--accent); font-size: .82rem; margin-left: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>📊 nfe-bench <span class="live" id="live"></span></h1>
  <p class="subtitle">Benchmark de parsers de NF-e · atualize a página p/ recarregar</p>

  <div class="cards" id="cards"></div>

  <table>
    <thead>
      <tr><th>Parser</th><th>Acurácia média</th><th></th><th>Tempo mediano</th><th>Erros</th></tr>
    </thead>
    <tbody id="ranking"></tbody>
  </table>

  <h1 style="font-size:1.1rem;margin-bottom:12px">Detalhes por amostra</h1>
  <div id="details"></div>

  <p class="footer">Gerado por nfe-bench · rode <code>python scripts/serve.py --bench</code> p/ dados fresquinhos</p>
</div>

<script>
// Dados embutidos (último benchmark) — fetch tenta buscar os mais recentes
const EMBEDDED = [
  {
    "parser": "manual-xml (baseline)",
    "sample": "nfe-001-venda-sp.xml",
    "ok": true,
    "error": null,
    "accuracy": 1.0,
    "elapsed_ms": 0.47472099993228767,
    "missing_fields": [],
    "wrong_fields": []
  },
  {
    "parser": "manual-xml (baseline)",
    "sample": "nfe-002-venda-mg.xml",
    "ok": true,
    "error": null,
    "accuracy": 1.0,
    "elapsed_ms": 0.47280300009333587,
    "missing_fields": [],
    "wrong_fields": []
  }
];

function render(data) {
  const okRuns = data.filter(r => r.ok);
  const parsers = [...new Set(data.map(r => r.parser))];
  const samples = [...new Set(data.map(r => r.sample))];
  const avgAcc = okRuns.length ? okRuns.reduce((s,r) => s + r.accuracy, 0) / okRuns.length : 0;
  const avgMs  = okRuns.length ? okRuns.reduce((s,r) => s + r.elapsed_ms, 0) / okRuns.length : 0;

  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="label">Parsers</div><div class="value">${parsers.length}</div></div>
    <div class="card"><div class="label">Amostras</div><div class="value">${samples.length}</div></div>
    <div class="card"><div class="label">Acurácia média</div><div class="value" style="color:var(--green)">${(avgAcc*100).toFixed(1)}%</div></div>
    <div class="card"><div class="label">Tempo médio</div><div class="value" style="color:var(--accent)">${avgMs.toFixed(2)} ms</div></div>`;

  // ranking agregado
  const agg = {};
  data.forEach(r => {
    agg[r.parser] = agg[r.parser] || { runs: [], errors: 0 };
    if (r.ok) agg[r.parser].runs.push(r); else agg[r.parser].errors++;
  });
  const rows = Object.entries(agg).map(([name, info]) => {
    const acc = info.runs.length ? info.runs.reduce((s,r) => s + r.accuracy, 0) / info.runs.length : 0;
    const times = info.runs.map(r => r.elapsed_ms).sort((a,b) => a-b);
    const med = times.length ? times[Math.floor(times.length/2)] : NaN;
    return { name, acc, med, errors: info.errors };
  }).sort((a,b) => b.acc - a.acc || a.med - b.med);

  document.getElementById("ranking").innerHTML = rows.map(r => `
    <tr>
      <td><strong>${r.name}</strong></td>
      <td>${(r.acc*100).toFixed(1)}%</td>
      <td><div class="bar-wrap"><div class="bar" style="width:${(r.acc*100).toFixed(0)}%"></div></div></td>
      <td>${isNaN(r.med) ? "—" : r.med.toFixed(3) + " ms"}</td>
      <td>${r.errors === 0 ? '<span class="badge ok">0 erros</span>' : `<span class="badge err">${r.errors} erro(s)</span>`}</td>
    </tr>`).join("");

  // detalhes
  document.getElementById("details").innerHTML = data
    .slice().sort((a,b) => a.parser.localeCompare(b.parser) || a.sample.localeCompare(b.sample))
    .map(r => r.ok ? `
      <details>
        <summary>${r.parser} · ${r.sample} — ${(r.accuracy*100).toFixed(1)}% em ${r.elapsed_ms.toFixed(3)} ms</summary>
        ${r.missing_fields.length ? `<div class="detail-line warn">⚠️ Ausentes: ${r.missing_fields.join(", ")}</div>` : ""}
        ${r.wrong_fields.length ? `<div class="detail-line warn">⚠️ Incorretos: ${r.wrong_fields.join(", ")}</div>` : ""}
        ${!r.missing_fields.length && !r.wrong_fields.length ? '<div class="detail-line">✅ Todos os campos corretos</div>' : ""}
      </details>` : `
      <details>
        <summary>❌ ${r.parser} · ${r.sample}</summary>
        <div class="detail-line warn">${r.error}</div>
      </details>`).join("");
}

fetch("results/results.json").then(r => {
  if (!r.ok) throw new Error();
  document.getElementById("live").textContent = "· dados ao vivo ✅";
  return r.json();
}).then(render).catch(() => {
  document.getElementById("live").textContent = "· dados embutidos (rode com serve.py p/ ao vivo)";
  render(EMBEDDED);
});
</script>
</body>
</html>
